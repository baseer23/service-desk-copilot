name: Production release validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-validation
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TEST_MODE: "true"
      DATA_PLATFORM: local
      LOCAL_PERSISTENCE_ENABLED: "false"
      DEPLOYMENT_MODE: local
      ENABLE_LOCAL_FIXTURES: "true"
      GENERATION_PROVIDER: stub
      EMBED_PROVIDER: stub
      NEO4J_URI: ""
      MCP_SERVERS: "[]"
      SPEECH_ENABLED: "false"
      ALLOW_URL_INGEST: "false"
      VOICE_SESSION_SIGNING_KEY: release-isolated-signing-key-xxxxxxxxxxxxxxxxxxxxxxxx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify promotion ancestry
        run: |
          git fetch origin staging --depth=1
          git merge-base --is-ancestor origin/staging "$GITHUB_SHA" || {
            echo "main must be promoted from a staging commit" >&2
            exit 1
          }
      - name: Install and validate release candidate
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check
          npm --prefix frontend ci
          .venv/bin/python -m compileall -q backend/app
          .venv/bin/python -m pytest -q -m "not live" backend/app/tests/test_semantic_memory.py backend/app/tests/test_mcp_security.py backend/app/tests/test_provider_selection.py backend/app/tests/test_storage_safety.py
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Deployment status
        run: echo "Release candidate validated; no production hosting target is configured."

